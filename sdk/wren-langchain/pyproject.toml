[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wren-langchain"
version = "0.4.0"
description = "LangChain and LangGraph integration for Wren AI Core — attach a CLI-prepared Wren project to your agent in three lines."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Wren AI", email = "contact@getwren.ai" }]
keywords = [
  "wrenai", "wren", "langchain", "langgraph", "agent", "ai-agent",
  "sql", "context-layer", "semantic", "mdl", "data-modeling", "analytics",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Database",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "wren-engine>=0.5.0",
  "langchain>=1.0",
  "langchain-core>=0.3",
  "langgraph>=1.0",
  "pydantic>=2",
]

[project.optional-dependencies]
postgres   = ["wren-engine[postgres]>=0.5.0"]
mysql      = ["wren-engine[mysql]>=0.5.0"]
bigquery   = ["wren-engine[bigquery]>=0.5.0"]
snowflake  = ["wren-engine[snowflake]>=0.5.0"]
clickhouse = ["wren-engine[clickhouse]>=0.5.0"]
trino      = ["wren-engine[trino]>=0.5.0"]
mssql      = ["wren-engine[mssql]>=0.5.0"]
databricks = ["wren-engine[databricks]>=0.5.0"]
redshift   = ["wren-engine[redshift]>=0.5.0"]
spark      = ["wren-engine[spark]>=0.5.0"]
athena     = ["wren-engine[athena]>=0.5.0"]
oracle     = ["wren-engine[oracle]>=0.5.0"]
memory = ["wren-engine[memory]>=0.5.0"]
all = ["wren-engine[all]>=0.5.0"]
dev = [
  "pytest>=8",
  "pytest-mock>=3",
  "ruff>=0.4",
  "wren-engine[memory]>=0.5.0",
]

[project.urls]
Homepage      = "https://getwren.ai"
Documentation = "https://github.com/Canner/WrenAI/tree/main/sdk/wren-langchain#readme"
Repository    = "https://github.com/Canner/WrenAI"
Issues        = "https://github.com/Canner/WrenAI/issues"
Changelog     = "https://github.com/Canner/WrenAI/blob/main/sdk/wren-langchain/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/wren_langchain"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "PLC"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra -m \"not slow\""
markers = [
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
filterwarnings = [
  "ignore::langchain_core._api.deprecation.LangChainPendingDeprecationWarning",
  "ignore:AgentStatePydantic has been moved",
]
